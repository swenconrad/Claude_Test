[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "job-app-helper"
version = "1.0.0"
description = "A CLI tool to help you apply for jobs quickly"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jobapp = "job_app_helper.cli:main"

[tool.setuptools.packages.find]
include = ["job_app_helper*"]
